name: Gokmen Berber APK
on:
  push:
    branches: [gokmen-berber-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: gokmenberber
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx cap add android
      - name: Set launcher label
        run: |
          grep -q 'Gökmen Berber' android/app/src/main/res/values/strings.xml
      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gokmen-Berber-APK
          path: gokmenberber/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
